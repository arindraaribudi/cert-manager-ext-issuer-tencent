name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Explicit semver (only when bump=custom). e.g. 0.2.0"
        required: false
        type: string
        default: ""
      tag_prefix:
        description: "Tag prefix"
        required: false
        type: string
        default: "v"
      prerelease:
        description: "Mark release as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: security audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: go test
        run: make test

      - name: go build
        run: CGO_ENABLED=0 go build -o /tmp/manager-build ./cmd/main.go

  release:
    name: release
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    env:
      PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
      IMAGE_NAME: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}', github.repository) }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM: ${{ inputs.custom_version }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          # Semver: MAJOR.MINOR.PATCH (no leading 'v'); tag = "<prefix><ver>"
          semver_re='^([0-9]+)\.([0-9]+)\.([0-9]+)$'

          git fetch --tags --force

          # Highest existing tag, e.g. v0.1.3 -> 0.1.3
          latest="$(git tag --list "${PREFIX}*" --sort=-version:refname | head -n1 || true)"
          if [ -n "${latest}" ]; then
            current="${latest#${PREFIX}}"
          else
            current="0.0.0"
          fi

          if [[ "${current}" =~ ${semver_re} ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Latest tag '${latest:-<none>}' is not semver (${current}). Aborting." >&2
            exit 1
          fi

          if [ "${BUMP}" = "custom" ]; then
            if [ -z "${CUSTOM}" ]; then
              echo "::error::bump=custom requires custom_version." >&2
              exit 1
            fi
            if [[ "${CUSTOM}" =~ ${semver_re} ]]; then
              next="${CUSTOM}"
            else
              echo "::error::custom_version '${CUSTOM}' is not semver MAJOR.MINOR.PATCH." >&2
              exit 1
            fi
          else
            case "${BUMP}" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              patch) next="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::Unknown bump '${BUMP}'." >&2; exit 1 ;;
            esac
          fi

          tag="${PREFIX}${next}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' already exists." >&2
            exit 1
          fi

          echo "version=${next}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "Resolved ${tag} (current was ${current}, bump=${BUMP})."

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: create + push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          # App token bypasses the GITHUB_TOKEN no-trigger rule, so ci.yml fires.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TAG}"

      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set build timestamp
        id: timestamp
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: build + push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VCS_VERSION=${{ steps.version.outputs.tag }}
            BUILD_DATE=${{ steps.timestamp.outputs.ts }}
          annotations: |
            org.opencontainers.image.title=cert-manager-ext-issuer-tencent
            org.opencontainers.image.description=External issuer for cert-manager using Tencent Cloud SSL Certificates API.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.ts }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=ArindraAribudi

      - name: build installer
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          make build-installer IMG=${{ env.IMAGE_NAME }}:${TAG}

      - name: stage assets
        run: ls -la dist && ls -la "${{ steps.build.outputs.sbom }}"

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/install.yaml
            ${{ steps.build.outputs.sbom }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: mark release as latest
        if: ${{ !inputs.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "${TAG}" --latest --repo "${GITHUB_REPOSITORY}"

      - name: summary
        if: always()
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "- bump: \`${{ inputs.bump }}\`"
            echo "- prerelease: \`${{ inputs.prerelease }}\`"
            echo "- image: \`${{ env.IMAGE_NAME }}\`"
            echo "- preflight: \`${{ needs.preflight.result }}\`"
            echo "- release: \`${{ job.status }}\`"
          } >>"$GITHUB_STEP_SUMMARY"